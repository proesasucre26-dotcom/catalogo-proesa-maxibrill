<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="whiteOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="7"/>
      <feFlood flood-color="#FFFFFF" result="WHITE"/>
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#whiteOutline)">
    <!-- MAXI Top Arc -->
    <path fill="#C4272B" d="
      M 45 135 L 75 42 L 125 42 L 150 96 L 175 42 L 225 42 L 255 135 L 215 135 L 198 82 L 170 135 L 130 135 L 102 82 L 85 135 Z
      M 240 135 L 290 32 L 340 32 L 390 135 L 345 135 L 333 105 L 297 105 L 285 135 Z
      M 315 58 L 304 88 L 326 88 Z
    "/>
    <!-- Central stylized block representation -->
    <text x="200" y="125" font-family="'Space Grotesk', Impact, 'Arial Black', sans-serif" font-weight="900" font-size="108" text-anchor="middle" fill="#C4272B" letter-spacing="3" transform="scale(1, 1.1) translate(0, -10)">MAXI</text>
    <text x="200" y="240" font-family="'Space Grotesk', Impact, 'Arial Black', sans-serif" font-weight="900" font-size="112" text-anchor="middle" fill="#C4272B" letter-spacing="2" transform="scale(1.05, 1.15) translate(-10, -32)">BRILL</text>
  </g>
</svg>